<svg xmlns="http://www.w3.org/2000/svg" width="800" height="216" viewBox="0 0 800 216" role="img" aria-labelledby="title description">
  <title id="title">FlexiBee PHP HTTP client</title>
  <desc id="description">The geometric A symbol adapted from the official ABRA FlexiBee logo, with Ecomail-green triangles on a dark navy panel.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#142536"/>
      <stop offset="1" stop-color="#0b1422"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="798" height="214" rx="24" fill="url(#panel)" stroke="#2a4052" stroke-width="2"/>
  <rect x="28" y="28" width="160" height="160" rx="24" fill="#102331" stroke="#2a4956"/>
  <g transform="translate(48 73.359)" aria-label="ABRA FlexiBee symbol adapted in Ecomail green">
    <path d="M40 0H80L40 69.282H0Z" fill="#f1f7fa"/>
    <path d="m80 0-20 34.641h40Z" fill="#59BC1C" fill-opacity=".6"/>
    <path d="m60 34.641 20 34.641 20-34.641Z" fill="#59BC1C" fill-opacity=".8"/>
    <path d="m100 34.641-20 34.641h40Z" fill="#59BC1C"/>
  </g>
  <text x="222" y="104" fill="#f1f7fa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700" letter-spacing="-2">flexibee<tspan fill="#59BC1C">.</tspan></text>
  <text x="225" y="141" fill="#d0dfe7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600" letter-spacing="3">PHP HTTP CLIENT</text>
  <path d="M604 61v94" stroke="#2a4052" stroke-width="2"/>
  <g fill="#9db7c6" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    <text x="637" y="80">REQUEST</text>
    <text x="637" y="113">FLEXIBEE API</text>
    <text x="637" y="146">RESPONSE</text>
  </g>
  <g fill="#59BC1C">
    <circle cx="620" cy="76" r="3"/>
    <circle cx="620" cy="109" r="3"/>
    <circle cx="620" cy="142" r="3"/>
  </g>
</svg>
